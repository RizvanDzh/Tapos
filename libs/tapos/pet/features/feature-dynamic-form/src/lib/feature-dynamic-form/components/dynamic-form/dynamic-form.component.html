<div class="buttons">
  <button class="btn" type="button" (click)="formLoadingTrigger.next('user')">Load User Form</button>
  <button class="btn" type="button" (click)="formLoadingTrigger.next('company')">Load Company Form</button>
</div>
<div class="dynamic-form-container" *ngIf="formObservableConfig$ | async as formConfig">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <h3 class="form-heading">{{formConfig.description}}</h3>
    <div class="form-field" *ngFor="let control of formConfig.controls | keyvalue">
      <label [for]="control.key">{{control.value.label}}</label>
      <ng-container [ngSwitch]="control.value.controlType">
        <input [formControlName]="control.key" *ngSwitchCase="'input'" [type]="control.value.type" [id]="control.key" [value]="control.value.value">
        <ng-container *ngSwitchCase="'select'">
          <select [id]="control.key" [value]="control.value.value" [formControlName]="control.key">
            <option *ngFor="let option of control.value?.options" [value]="option.value">
              {{option.label}}
            </option>
          </select>
        </ng-container>
      </ng-container>
    </div>
    <button>Save</button>
  </form>
</div>
